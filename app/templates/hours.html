<section class="panel"><h2>小时复算清单</h2><div class="scroll"><table><thead><tr><th>小时</th><th>有效 / 门槛</th><th>免计</th><th>缺证</th><th>迟补有效</th><th>浓度 mg/Nm³</th><th>判定</th></tr></thead><tbody>{% for h in result.hours.rows %}<tr><td>{{ h.local }}</td><td>{{ h.valid }} / {{ h.threshold }}</td><td>{{ h.exempt }}</td><td>{{ h.missing }}</td><td>{{ h.late }}</td><td>{{ h.mg_nm3 or '—' }}</td><td>{{ labels[h.status] }}</td></tr>{% endfor %}</tbody></table></div></section>
