<section class="panel"><h2>监测留档</h2><div class="scroll"><table><thead><tr><th>归档编号</th><th>来源</th><th>时间 UTC</th><th>耗时 ms</th></tr></thead><tbody>{% for item in history %}<tr><td><a href="{{ url_for('desk.show',page='evidence',run=item.run_id) }}">{{ item.run_id[:16] }}</a></td><td>{{ item.source }}</td><td>{{ item.created_utc }}</td><td>{{ item.elapsed_ms }}</td></tr>{% else %}<tr><td colspan="4">先归档一份监测原件。</td></tr>{% endfor %}</tbody></table></div></section>
